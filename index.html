<button id="openServiceButton" style="display: none;">Ouvrir le service</button>

<script>
  const serviceSelect2 = document.getElementById('serviceSelect2');
  const openServiceButton = document.getElementById('openServiceButton');

  serviceSelect2.addEventListener('change', function() {
    if (this.value) {
      openServiceButton.style.display = 'inline-block';
    }
  });

  openServiceButton.addEventListener('click', function() {
    const selectedService = serviceSelect2.value;
    if (selectedService) {
      window.open(selectedService, '_blank');
    }
  });
</script>
